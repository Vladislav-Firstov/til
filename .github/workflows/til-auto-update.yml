name: Build TIL Readme

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto update TIL Readme
        uses: stefanbuck/til-auto-update@v1
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
